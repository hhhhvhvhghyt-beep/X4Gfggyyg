# برای VPS واقعی: docker compose up -d --build
services:
  wgpanel:
    build: .
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls: ["net.ipv4.ip_forward=1"]
    ports: ["8000:8000", "51820:51820/udp"]
    environment:
      - PANEL_PASSWORD=change-me
    volumes: ["./data:/app/data"]
